<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>No Gooning • Made by Jarrar</title><style>body{font-family:system-ui;background:#09090d;color:#fff;max-width:520px;margin:auto;padding:24px}button{padding:12px;border:0;border-radius:12px;font-weight:800}input,select{width:100%;padding:12px;margin:6px 0 12px;background:#111;color:#fff;border:1px solid #333;border-radius:10px}.card{background:#15151d;padding:18px;border-radius:18px;margin:12px 0}.danger{background:#e5484d;color:#fff}.primary{background:#fff}.hidden{display:none}</style></head><body><h1>NO GOONING</h1><p>Made by Jarrar</p><div id="setup" class="card"><h2>Set up your profile</h2><label>Name</label><input id="name"><label>Gender</label><select id="gender"><option value="">Select gender</option><option>Male</option><option>Female</option><option>Other</option></select><label>Height</label><input id="height" type="number"><label>Weight</label><input id="weight" type="number"><button class="primary" onclick="start()">ENTER THE GAME</button></div><div id="game" class="card hidden"><h2>Current Streak: <span id="streak">0</span></h2><p>AURA: <span id="aura">0</span></p><button class="danger" onclick="goon()">💀 I GOONED</button><button class="primary" onclick="clean()">I DIDN'T GOON</button><hr><h3>⚔️ Daily Dare</h3><p id="dare"></p><button onclick="doneDare()">I DID IT</button><h3>🎮 Game Modes</h3><button onclick="memory()">🧠 Memory Sequence</button> <button onclick="reaction()">⚡ Reaction Test</button></div><script>const K='ng_jarrar_file';let d=JSON.parse(localStorage.getItem(K)||'null')||{a:0,s:0};const save=()=>localStorage.setItem(K,JSON.stringify(d));const $=x=>document.getElementById(x);function start(){if(!$('name').value.trim()||!$('gender').value||!$('height').value||!$('weight').value)return alert('Fill all profile fields');d.profile={name:$('name').value,gender:$('gender').value,height:$('height').value,weight:$('weight').value};save();$('setup').classList.add('hidden');$('game').classList.remove('hidden');render()}function render(){$('streak').textContent=d.s;$('aura').textContent=d.a;$('dare').textContent='Phone Lockdown: put your phone away for 60 minutes.'}function clean(){d.s++;save();render();alert('CONGRATULATIONS! You did not goon today.')}function goon(){if(confirm('Did you actually goon?')){d.s=0;save();render();alert('Oh bhenchodd muthal! 😂🤣')}}function doneDare(){if(confirm('Did you really complete the dare?')){d.a+=25;save();render();alert('+25 AURA')}}function memory(){let n=['A','B','C','D'].sort(()=>Math.random()-.5).join(' ');alert('MEMORIZE: '+n);setTimeout(()=>{let x=prompt('Type the sequence');if(x&&x.trim().toUpperCase().replace(/\s+/g,' ')===n){d.a+=20;save();render();alert('+20 AURA')}else alert('Wrong sequence')},2500)}function reaction(){let t=1000+Math.random()*2000;alert('Wait...');setTimeout(()=>{let s=Date.now();alert('GO! Tap OK immediately');let ms=Date.now()-s;let r=Math.max(10,Math.min(30,30-Math.floor(ms/100)));d.a+=r;save();render();alert(ms+'ms • +'+r+' AURA')},t)}if(d.profile){$('setup').classList.add('hidden');$('game').classList.remove('hidden');render()}</script></body></html>
